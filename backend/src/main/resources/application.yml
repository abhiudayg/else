spring:
  application:
    name: else-api
  datasource:
    url: jdbc:h2:file:./.data/else;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

else:
  cors:
    allowed-origins: "*"
