name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (test + package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test
        run: mvn -B test
        env:
          SPRING_PROFILES_ACTIVE: ""
          ELSE_DB_URL: ""
          SPRING_DATASOURCE_URL: ""

      - name: Package
        run: mvn -B -DskipTests package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: else-api-jar
          path: backend/target/else-api-*.jar
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: else-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke healthcheck
        run: |
          set -euo pipefail
          docker run -d --name else-api-ci -p 8081:8081 else-api:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8081/api/v1/health >/tmp/else-health.json; then
              cat /tmp/else-health.json
              docker rm -f else-api-ci
              exit 0
            fi
            sleep 3
          done
          docker logs else-api-ci || true
          docker rm -f else-api-ci
          exit 1
