</head><body class="bg-background text-on-surface antialiased min-h-screen flex flex-col relative selection:bg-primary-container selection:text-on-primary-container"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-surface"><div class="flex flex-col w-full relative select-none overflow-hidden">
<!-- Sensor Canvas Simulation (Level 0) with Live Dynamic Motion Blur Overlay -->
<div class="relative w-full overflow-hidden rounded-lg bg-surface-container-lowest" style="min-height: 780px;">
<!-- Illegible Document Sensor Feed -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center filter blur-md scale-105 transform origin-center transition-all duration-700" data-alt="Close up first-person camera shot of an intricate pharmaceutical label and technical spec sheet, with heavy realistic directional motion blur and optical defocus rendering typography completely illegible. Ambient cool laboratory lighting with deep graphite shadows, ultra-detailed glass reflections, dark slate palette with subtle electric blue sheen." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBFSM2FlWhznWujlsLsVsg4-CpJPSI2NjKylCpvqKhXX1gHAEYP1y0IZwRFVH_lOB3ROnIIXjH5yzeOrHi1xRw8-CPnaxhEhhI7cLywaIzw9KD0WIqRTsSN3tiJSfuYHlz-Yjw7R34WbhFq5phILzRCLhz-4P4Gsrrpv2LAjfNNxW9ifP34tYaVLcUQPzQMLOANqBnhj8kVHWlHVJGrWG4FfuYRnh9Jq18Oeu5mfzCYqPjESv7fh05W')">
</div>
<!-- Liquid Glass Level 1 Ambient Optical Scrim Vignette -->
<div class="absolute inset-0 bg-gradient-to-b from-black/60 via-background/40 to-black/80 pointer-events-none"></div>
<!-- Active Optical Scan Reticle Frame (Delight/HUD detail) -->
<div class="absolute inset-x-8 top-28 bottom-72 rounded-lg pointer-events-none flex items-center justify-center opacity-70">
<div class="relative w-full h-full rounded-DEFAULT shadow-sm flex flex-col justify-between p-4">
<!-- Corner brackets indicating defocus region -->
<div class="flex justify-between items-start">
<div class="w-7 h-7 bg-transparent rounded-tl-DEFAULT shadow-[inset_3px_3px_0_0_#adc6ff] opacity-80"></div>
<div class="w-7 h-7 bg-transparent rounded-tr-DEFAULT shadow-[inset_-3px_3px_0_0_#adc6ff] opacity-80"></div>
</div>
<!-- Center Focus Loss Warning Indicator -->
<div class="self-center flex flex-col items-center gap-space-xs px-4 py-2 rounded-full bg-surface-container-lowest/70 backdrop-blur-md shadow-md">
<span class="material-symbols-outlined text-primary text-body-bold animate-pulse" style="font-variation-settings: 'FILL' 1;">blur_on</span>
<span class="font-label-caps text-label-caps text-primary uppercase tracking-wider">Unresolved Focal Plane</span>
</div>
<div class="flex justify-between items-end">
<div class="w-7 h-7 bg-transparent rounded-bl-DEFAULT shadow-[inset_3px_-3px_0_0_#adc6ff] opacity-80"></div>
<div class="w-7 h-7 bg-transparent rounded-br-DEFAULT shadow-[inset_-3px_-3px_0_0_#adc6ff] opacity-80"></div>
</div>
</div>
</div>
<!-- Top Status Control Plane (Dynamic Island clearance zone) -->
<header class="relative z-20 flex items-center justify-between px-space-md pt-4 pb-2">
<!-- Minimal ELSE Status Capsule -->
<div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-highest/60 backdrop-blur-2xl shadow-sm">
<div class="relative flex items-center justify-center w-2 h-2">
<span class="absolute w-2.5 h-2.5 rounded-full bg-tertiary/40 animate-ping"></span>
<span class="w-2 h-2 rounded-full bg-tertiary"></span>
</div>
<span class="font-label-caps text-label-caps text-on-surface uppercase tracking-widest">ELSE • VIZ 27</span>
<span class="font-caption text-caption text-on-surface-variant font-medium">L-04</span>
</div>
<!-- Close Action (Apple HIG Touch Surface >= 44x44pt) -->
<button aria-label="Dismiss scan" class="w-11 h-11 rounded-full flex items-center justify-center bg-surface-container-highest/60 text-on-surface hover:text-white backdrop-blur-2xl transition-transform active:scale-90 shadow-sm" id="dismiss-btn" onclick="window.history.length &gt; 1 ? window.history.back() : null;" type="button">
<span class="material-symbols-outlined text-body-bold">close</span>
</button>
</header>
<!-- Center/Lower Floating Liquid Glass Verdict Card (iOS 27 Elevation Level 2/3) -->
<div class="relative z-20 px-space-md pt-32 pb-6 flex flex-col justify-end min-h-[640px]">
<div class="w-full rounded-lg bg-surface-container-low/80 backdrop-blur-3xl shadow-xl p-space-lg flex flex-col gap-space-md transition-all duration-300">
<!-- Card Grabber Handle -->
<div class="self-center w-9 h-1 rounded-full bg-on-surface/20 -mt-2"></div>
<!-- Optical Warning Badge -->
<div class="flex items-center gap-2 self-start px-3 py-1 rounded-full bg-surface-container-highest/80 backdrop-blur-md">
<span class="material-symbols-outlined text-tertiary text-caption-bold" style="font-variation-settings: 'FILL' 1;">camera</span>
<span class="font-label-caps text-label-caps text-tertiary font-semibold tracking-wider uppercase">Optical Defocus Detected</span>
</div>
<!-- Headline & Explanatory Synthesis -->
<div class="flex flex-col gap-space-xs">
<h2 class="font-headline-md text-headline-md text-on-surface tracking-tight">
            I can't read the small print.
          </h2>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
            Move closer, steady your iPhone, and ensure adequate lighting so ELSE can inspect the fine details.
          </p>
</div>
<!-- Action Control Cluster -->
<div class="flex flex-col gap-space-sm pt-2">
<!-- Primary: Retake Photo (Cupertino Accent Pill) -->
<button class="group w-full h-[52px] rounded-full bg-primary-container text-on-primary-container font-body-bold text-body-bold flex items-center justify-center gap-2.5 transition-all duration-150 active:scale-[0.98] shadow-md hover:bg-primary-container/90" id="retake-btn" type="button">
<span class="material-symbols-outlined text-title transition-transform group-hover:rotate-12" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
<span>Retake Photo</span>
</button>
<!-- Secondary: Ask Anyway (Translucent Liquid Glass Action Pill) -->
<button class="w-full h-12 rounded-full bg-surface-container-highest/50 hover:bg-surface-container-highest/70 text-on-surface font-body-md text-body-md backdrop-blur-md flex items-center justify-center transition-all duration-150 active:scale-[0.98]" id="ask-anyway-btn" type="button">
<span>Ask anyway</span>
</button>
</div>
<!-- Micro-guidance Optical Strip (Haptic Macro Lock Tip) -->
<div class="flex items-center justify-center gap-2 pt-1 pb-1">
<span class="material-symbols-outlined text-on-surface-variant text-caption">touch_app</span>
<p class="font-caption text-caption text-on-surface-variant text-center">
            Tip: Tap screen to lock optical macro focus.
          </p>
</div>
</div>
</div>
</div>
</div>
<script>
  (function() {
    const retakeBtn = document.getElementById('retake-btn');
    const askAnywayBtn = document.getElementById('ask-anyway-btn');

    if (retakeBtn) {
      retakeBtn.addEventListener('click', function() {
        if (window.navigator && window.navigator.vibrate) {
          window.navigator.vibrate(12);
        }
        retakeBtn.classList.add('opacity-80');
        setTimeout(() => retakeBtn.classList.remove('opacity-80'), 180);
      });
    }

    if (askAnywayBtn) {
      askAnywayBtn.addEventListener('click', function() {
        if (window.navigator && window.navigator.vibrate) {
          window.navigator.vibrate([8, 30, 8]);
        }
      });
    }
  })();
</script></main><div class="fixed bottom-0 inset-x-0 pointer-events-none z-50 flex justify-center pb-2"><div class="w-36 h-1 bg-on-surface/40 rounded-full"></div></div></body></html>
